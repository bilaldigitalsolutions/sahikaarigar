# =============================================================================
# Render Blueprint — deploys auth-server/ as a FREE web service.
#
# Assumes the GitHub repo root is `sahikarigar-app/` (so rootDir is auth-server).
# Render Dashboard -> New -> Blueprint -> pick the repo. It reads this file.
#
# Free tier: 512 MB RAM, no card required. Spins down when idle (see the guide).
# =============================================================================
services:
  - type: web
    name: sahikaarigar-auth
    runtime: node
    plan: free
    region: singapore
    rootDir: auth-server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Node 22+ is REQUIRED. @supabase/supabase-js (>=2.50) needs a native
      # global `WebSocket`, which Node only ships from v22 onwards. On Node 20
      # the service crashes at boot with:
      #   "Error: Node.js detected but native WebSocket not found."
      - key: NODE_VERSION
        value: '22'
      # Real SMS via Fast2SMS (India — DLT-free OTP route, UPI, no card).
      #   route=q ("Quick SMS") works with ONLY FAST2SMS_API_KEY set below.
      #   Use 'console' to print the OTP in the Render logs instead (free).
      - key: SMS_PROVIDER
        value: fast2sms
      # From Fast2SMS dashboard -> Dev API -> API KEY. (sync: false = not in git)
      - key: FAST2SMS_API_KEY
        sync: false
      - key: APP_NAME
        value: SahiKaarigar
      # Set these in the Render dashboard (marked "sync: false" = not in git).
      - key: SUPERTOKENS_CONNECTION_URI
        sync: false
      - key: SUPERTOKENS_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # The static site origin. API_DOMAIN is auto-detected from
      # RENDER_EXTERNAL_URL, so it usually does not need setting.
      - key: WEBSITE_DOMAIN
        value: https://sahi-kaarigar.web.app
