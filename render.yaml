# =============================================================================
# Render Blueprint — deploys auth-server/ as a FREE web service.
#
# Assumes the GitHub repo root is `sahikarigar-app/` (so rootDir is auth-server).
# Render Dashboard -> New -> Blueprint -> pick the repo. It reads this file.
#
# Free tier: 512 MB RAM, no card required. Spins down when idle (see the guide).
# =============================================================================
services:
  - type: web
    name: sahikaarigar-auth
    runtime: node
    plan: free
    region: singapore
    rootDir: auth-server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Node 22+ is REQUIRED. @supabase/supabase-js (>=2.50) needs a native
      # global `WebSocket`, which Node only ships from v22 onwards. On Node 20
      # the service crashes at boot with:
      #   "Error: Node.js detected but native WebSocket not found."
      - key: NODE_VERSION
        value: '22'
      # SMS is AUTO-DETECTED from whichever provider credentials are present,
      # so just add your provider's key in the Render dashboard (Environment
      # tab) and real SMS starts working — nothing to change here.
      #   StartMessaging -> STARTMESSAGING_API_KEY          (India, DLT-FREE, UPI)
      #   Fast2SMS -> FAST2SMS_API_KEY (+ FAST2SMS_OTP_TEMPLATE_ID)  (India, UPI;
      #               the SMS OTP route needs DLT — WhatsApp/Quick-SMS do not)
      #   MSG91    -> MSG91_AUTH_KEY + MSG91_TEMPLATE_ID     (India, needs DLT)
      #   Twilio   -> TWILIO_ACCOUNT_SID/AUTH_TOKEN/FROM     (global, needs card)
      #   Admin    -> ADMIN_EMAIL + ADMIN_PASSWORD + ADMIN_SESSION_SECRET (32+ chars)
      # With no credentials OTP delivery fails closed; configure a real provider.
      - key: APP_NAME
        value: SahiKaarigar
      # Set these in the Render dashboard (marked "sync: false" = not in git).
      - key: SUPERTOKENS_CONNECTION_URI
        sync: false
      - key: SUPERTOKENS_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # AES-256-GCM key for Aadhaar at rest. Generate once with:
      #   node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"
      # Changing it makes existing Aadhaar ciphertext unreadable.
      - key: AADHAAR_ENCRYPTION_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SESSION_SECRET
        sync: false
      # The static site origin. API_DOMAIN is auto-detected from
      # RENDER_EXTERNAL_URL, so it usually does not need setting.
      - key: WEBSITE_DOMAIN
        value: https://sahi-kaarigar.web.app
