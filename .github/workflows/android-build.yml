name: Android APK Build (Free)

# =============================================================================
# EAS free plan khatam hone ki wajah se CI par APK banate hain:
#   checkout → node → npm install → expo prebuild → signing inject → gradle → upload
# Secrets (repo Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
# =============================================================================

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Repo ka layout dono tarah ka ho sakta hai — ya toh GitHub repo root
      # hi mobile app hai (sahikarigar-mobile), ya uske andar ek folder hai.
      # Dono cases handle karne ke liye app directory detect kar lete hain.
      - name: Detect app directory
        run: |
          if [ -f "package.json" ] && [ -d "android" -o -f "app.json" ] && grep -q '"expo"' package.json 2>/dev/null; then
            echo "APP_DIR=." >> "$GITHUB_ENV"
          elif [ -f "sahikarigar-mobile/package.json" ]; then
            echo "APP_DIR=sahikarigar-mobile" >> "$GITHUB_ENV"
          else
            echo "::error::sahikarigar-mobile app directory nahi mili" && exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json

      # Release APK sirf arm64-v8a (see plugins/WithAndroidArchitectures), isliye
      # itna disk space kaafi hai — phir bhi safety ke liye extra tools hata dete hain.
      - name: Free up disk space
        uses: jlumbroso/free-disk-space@main
        with:
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true

      # Clear Gradle cache so the build uses freshly generated native assets
      # (expo prebuild --clean regenerates android/ from scratch).
      - name: Clear Gradle cache
        run: |
          rm -rf ~/.gradle/caches/
          rm -rf ${{ env.APP_DIR }}/android/.gradle/
          rm -rf ${{ env.APP_DIR }}/android/app/.gradle/
          echo "Gradle cache cleared"

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm install

      # android/ folder gitignored hai — CI par yahin se generate hota hai.
      - name: Expo prebuild (generate android project)
        working-directory: ${{ env.APP_DIR }}
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
        run: npx expo prebuild --platform android --no-install --clean

      - name: Setup Java (Zulu 17)
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle
          cache-dependency-path: ${{ env.APP_DIR }}/android/**/*.gradle*

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'
          cmdline-tools-version: latest
          accept-android-sdk-licenses: true

      # Keystore ko secret se decode karke runner ke temp folder me rakhte hain
      # (repo me kabhi nahi jaata). env indirection se secret command line par
      # nahi dikhta.
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret set nahi hai — repo Settings → Secrets and variables → Actions me add karo."
            exit 1
          fi
          # Windows se copy ki base64 me CRLF/newlines/spaces aa sakte hain,
          # jinse "base64: invalid input" aata hai — decode se pehle saari
          # whitespace hata do ([:space:] = \n \r tab space).
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/keystore.jks"
          if [ ! -s "$RUNNER_TEMP/keystore.jks" ]; then
            echo "::error::Keystore decode ho gayi par file khali hai — KEYSTORE_BASE64 value check karo."
            exit 1
          fi
          echo "Keystore decoded ($(wc -c < "$RUNNER_TEMP/keystore.jks") bytes)"
          # Quick sanity: keystore padh bhi sakti hai? Galat value abhi pakdi
          # jaayegi, 10 minute baad gradle signing par nahi.
          if [ -n "$KEYSTORE_PASSWORD" ]; then
            if keytool -list -keystore "$RUNNER_TEMP/keystore.jks" -storepass "$KEYSTORE_PASSWORD" > /dev/null 2>&1; then
              echo "Keystore verification PASSED (keytool ne password sahi bataya)"
            else
              echo "::warning::keytool se verify nahi ho paayi — file theek hai par password/type galat ho sakta hai. Gradle step par dhyan do."
            fi
          fi

      # Expo prebuild release par debug signing lagata hai — ye script build.gradle
      # me release signingConfig inject karti hai (env vars se).
      - name: Inject release signing config
        working-directory: ${{ env.APP_DIR }}
        run: node scripts/inject-signing.js

      - name: Build release APK (gradle)
        working-directory: ${{ env.APP_DIR }}/android
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          MYAPP_UPLOAD_STORE_FILE: ${{ runner.temp }}/keystore.jks
          MYAPP_UPLOAD_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          MYAPP_UPLOAD_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MYAPP_UPLOAD_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx1536m -Dorg.gradle.daemon=false"
          # EXPO_PUBLIC_* vars Metro bundle time par inline hote hain —
          # eas.json ke barabar values yahan set karo.
          EXPO_PUBLIC_AUTH_API_URL: https://sahikaarigar-auth.onrender.com
          EXPO_PUBLIC_APP_NAME: Sahi Kaarigar
          EXPO_PUBLIC_DEMO_MODE: "0"
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SahiKaarigar-APK
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
